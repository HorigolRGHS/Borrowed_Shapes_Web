version: '3.8'

services:
  # --- PostgreSQL Service với pgvector ---
  postgres:
    # Thay đổi image ở đây
    image: postgres:16-alpine
    container_name: my_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: maihoangan
      POSTGRES_DB: Borrowed_Shapes
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  # --- Redis Stack giữ nguyên ---
  redis-stack:
    image: redis/redis-stack:latest
    container_name: my_redis_stack
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - ./redis_data:/data